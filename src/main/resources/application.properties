spring.application.name=qrshield
server.address=127.0.0.1
server.port=8081
server.error.include-stacktrace=never
server.error.include-message=never

# SQLite (file is created automatically; existing rows are kept on restart)
spring.datasource.url=jdbc:sqlite:${QRSHIELD_DB:instance/qrshield.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Upload limits
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# QRShield settings (secrets come from environment variables, never from this file)
qrshield.max-url-length=2048
qrshield.threshold-medium=25
qrshield.threshold-high=60
qrshield.max-image-pixels=12000000
qrshield.page-size=10
qrshield.tmp-dir=instance/tmp
qrshield.ti-provider=${TI_PROVIDER:none}
qrshield.safe-browsing-api-key=${SAFE_BROWSING_API_KEY:}
qrshield.ti-timeout-seconds=5
