<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-bs-theme="dark">
<head th:replace="~{fragments :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main id="main" class="container">
  <div class="text-center py-5">
    <div style="font-size:5rem;margin-bottom:1rem;filter:drop-shadow(0 0 24px rgba(159,93,255,.5))"
         th:text="${status}">4xx</div>
    <h1 class="h3 mb-2">Request could not be completed</h1>
    <p class="text-muted mx-auto" style="max-width:500px">
      The page does not exist, the request was invalid, the upload was too large,
      or your form session expired. Reload the page and try again.
    </p>
    <a class="btn btn-accent mt-3" th:href="@{/}" id="err-home-btn">← Back to Home</a>
  </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
